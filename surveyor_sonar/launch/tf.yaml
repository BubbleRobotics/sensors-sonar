launch: 

  - node:
      pkg: tf2_ros
      exec: static_transform_publisher
      name: base_link_to_sonar
      args: --x 0.0 --y 0.0 --z -0.07575 --qx 1.0 --qy 0.0 --qz 0.0 --qw 0.0 --frame-id base_link --child-frame-id sonar
      param:
      - name: use_sim_time
        value: $(var use_sim_time)
